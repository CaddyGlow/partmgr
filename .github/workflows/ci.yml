name: partmgr CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: partmgr
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: partmgr
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: partmgr -> target
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  fuzz-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked

  independent-partition-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: partmgr
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install independent partition tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk gdisk
          sfdisk --version
          sgdisk --version
      - name: Verify independent GPT and MBR fixtures
        run: |
          cargo test --all-features --locked sfdisk_generated -- --ignored
          cargo test --test independent --all-features --locked -- --include-ignored
