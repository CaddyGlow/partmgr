name: partmgr CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
defaults:
  run:
    working-directory: partmgr
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: partmgr
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.VIRTDISK_REPOSITORY || format('{0}/virtdisk', github.repository_owner) }}
          ref: ${{ vars.VIRTDISK_REF }}
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: partmgr -> target
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: partmgr
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.VIRTDISK_REPOSITORY || format('{0}/virtdisk', github.repository_owner) }}
          ref: ${{ vars.VIRTDISK_REF }}
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: partmgr -> target
      - run: cargo test --all-features --locked
