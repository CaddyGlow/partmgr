[package]
name = "partmgr"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/CaddyGlow/partmgr"
description = "Lossless GPT and MBR inspection, checked editing, and durable partition metadata plans"

readme = "README.md"
homepage = "https://github.com/CaddyGlow/partmgr"
keywords = ["partition", "gpt", "mbr", "disk"]
categories = ["filesystem", "parser-implementations"]

[dependencies]
virtdisk = { version = "0.2.0" }
sha2 = "0.10"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.23"

# Exhaustive recovery-cut tests repeatedly decode and audit whole filesystems.
# Optimize those loops while retaining the development profile's safety checks.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
redundant_clone = "warn"
chunks_exact_to_as_chunks = "allow"

[workspace]
exclude = ["fuzz", "integration/optical", "integration/storage"]
