[package]
name = "partmgr-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
honggfuzz = "=0.5.62"
partmgr = { path = "..", features = ["bitlocker"] }
