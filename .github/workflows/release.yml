name: partmgr Release
on:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: partmgr
jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: partmgr
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.VIRTDISK_REPOSITORY || format('{0}/virtdisk', github.repository_owner) }}
          ref: ${{ vars.VIRTDISK_REF }}
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: partmgr -> target
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PY
      - run: cargo package --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: partmgr/target/package/*.crate
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: partmgr
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.VIRTDISK_REPOSITORY || format('{0}/virtdisk', github.repository_owner) }}
          ref: ${{ vars.VIRTDISK_REF }}
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish crate and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.crate > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}" ./*.crate SHA256SUMS
